# Nome del micro servizio
spring.application.name=catalog

# Configurazione del database SQL
spring.datasource.url=jdbc:mysql://localhost:3306/shop
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configurazione di JPA (Java Persistence API)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configurazione del Config Server
spring.profiles.active=development
spring.config.import=optional:configserver:http://root:s3cr3t@localhost:8888

management.endpoints.web.exposure.include=*

# Configurazione di Eureka Server
eureka.client.service-url.default-zone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
